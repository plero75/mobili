name: Intégrité des écrans Mobili

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests des règles de mobilité
        run: npm test
      - name: Ressources HTML et syntaxe des scripts
        run: npm run check:ui
