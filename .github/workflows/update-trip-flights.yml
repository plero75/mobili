name: Mise à jour des vols du week-end

on:
  workflow_dispatch:
  schedule:
    - cron: "5 5,11,17 * * *"
  push:
    paths:
      - ".github/workflows/update-trip-flights.yml"
      - "scripts/update-trip-flights.py"

permissions:
  contents: write

jobs:
  update-trip-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le collecteur Google Flights
        run: |
          python -m pip install --upgrade pip
          python -m pip install fast-flights typing_extensions

      - name: Chercher les vols du 23 au 25 octobre
        run: python scripts/update-trip-flights.py

      - name: Publier le snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+plero75@users.noreply.github.com"
          git add dublin-2026/flights-live.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Mise à jour automatique des vols du week-end"
          git pull --rebase origin main
          git push origin main
